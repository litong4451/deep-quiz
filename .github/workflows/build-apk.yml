name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.caching=true"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      run: npm run build

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Compute version
      id: version
      run: |
        VERSION_NAME=$(node -p "require('./package.json').version")
        VERSION_CODE=$(git rev-list --count HEAD)
        TAG_NAME="v${VERSION_NAME}"
        echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
        echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
        echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
        if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
          echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
        else
          echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
        fi
        echo "Computed: versionName=${VERSION_NAME} versionCode=${VERSION_CODE} tag=${TAG_NAME}"

    - name: Patch Android version
      run: |
        cd android/app
        sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" build.gradle
        sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" build.gradle
        grep -E 'versionCode|versionName' build.gradle

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: deep-quiz-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create tag and release
      if: steps.version.outputs.tag_exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        TAG="${{ steps.version.outputs.tag }}"
        VNAME="${{ steps.version.outputs.version_name }}"
        VCODE="${{ steps.version.outputs.version_code }}"
        cp "android/app/build/outputs/apk/debug/app-debug.apk" "deep-quiz-${VNAME}.apk"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "${TAG}"
        git push origin "${TAG}"
        PRERELEASE=false
        case "${TAG}" in
          *-alpha*|*-beta*|*-rc*|*-pre*) PRERELEASE=true ;;
        esac
        gh release create "${TAG}" "deep-quiz-${VNAME}.apk" \
          --title "${TAG}" \
          --notes "Auto-generated release for ${TAG} (versionCode ${VCODE})" \
          --prerelease="${PRERELEASE}"